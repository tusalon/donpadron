plugins {
    id "com.android.application"
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "cu.donpadron.tienda"
    compileSdk 35

    defaultConfig {
        applicationId "cu.donpadron"
        minSdk 23
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    flavorDimensions "mode"
    productFlavors {
        client {
            dimension "mode"
            applicationIdSuffix ".tienda"
            manifestPlaceholders = [appLabel: "Don Padrón"]
            buildConfigField "String", "START_URL", '"https://tusalon.github.io/donpadron/"'
            buildConfigField "boolean", "ADMIN_MODE", "false"
        }
        admin {
            dimension "mode"
            applicationIdSuffix ".admin"
            manifestPlaceholders = [appLabel: "Don Padrón Admin"]
            buildConfigField "String", "START_URL", '"https://tusalon.github.io/donpadron/#/admin"'
            buildConfigField "boolean", "ADMIN_MODE", "true"
        }
    }

    if (keystorePath) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    adminImplementation "com.meta.androidbrowserhelper:androidbrowserhelper:2.5.0"
}

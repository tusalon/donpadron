name: Publicar tienda en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Compilar y publicar Don Padrón
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://gcfmccszyroygwvjkxkc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_v4rKabInNEwkZ5p3Kdp-XA_CV-n0NHM
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BHorj5Ms-sVltKiyxHvaYMs09GmX00t73WSmgJ-I4IidW6zJCEVdRpW5haJbAvVkZCgdjy4MykgsctLjj3nhzXg
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ctyan1ml
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: donpadron
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos publicados
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
